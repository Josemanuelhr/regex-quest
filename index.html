<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Quest</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🧩 Regex Quest</h1>

    <div id="game">

        <h2 id="title"></h2>

        <p id="description"></p>
        <p id="hint"></p>

        <h3>✅ Casos válidos</h3>
        <ul id="valid"></ul>

        <h3>❌ Casos inválidos</h3>
        <ul id="invalid"></ul>

        <input
            type="text"
            id="regexInput"
            placeholder="Introduce tu regex">

        <button onclick="checkAnswer()">
            Validar Regex
        </button>

        <p id="feedback"></p>

        <h3>XP: <span id="xp">0</span></h3>

    </div>

    <script src="script.js"></script>

</body>
</html>
